<html lang="en">
  <head>

    <title>Flowy · Enter code</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        color: #edf0df;
        background: #102320;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
      }
      .gate {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(100%, 390px);
        padding: 30px;
        border: 1px solid #426050;
        background: #162e28;
        border-radius: 18px;
      }
      .logo {
        width: 45px;
        height: 45px;
        border: 1px solid #adc590;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 26px;
        color: #cadfa5;
      }
      h1 {
        font-family: Georgia, serif;
        font-size: 38px;
        font-weight: normal;
        margin: 18px 0 10px;
      }
      p {
        font-size: 14px;
        line-height: 1.6;
        color: #b9c9b2;
      }
      label {
        display: block;
        font-size: 14px;
        margin: 22px 0 8px;
      }
      input {
        font: inherit;
        font-size: 16px;
        display: block;
        width: 100%;
        min-height: 48px;
        padding: 12px;
        border-radius: 9px;
        border: 1px solid #58705c;
        background: #102820;
        color: #edf0df;
      }
      button {
        font: inherit;
        cursor: pointer;
        border-radius: 9px;
        min-height: 48px;
        padding: 11px 18px;
        border: 1px solid #dbedb8;
        background: #dbedb8;
        color: #20372d;
      }
      #digits {
        text-align: center;
        font-size: 30px;
        letter-spacing: 7px;
        margin: 20px 0;
      }
      .keypad {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .keypad button {
        min-height: 54px;
        touch-action: manipulation;
      }
      .submit {
        width: 100%;
        margin-top: 13px;
      }
      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      input:focus-visible,
      button:focus-visible {
        outline: 2px solid #e7d899;
        outline-offset: 3px;
      }
      .status {
        font-size: 13px;
        min-height: 25px;
        margin: 14px 0 0;
        color: #ebc1a5;
      }
      .hint {
        font-size: 12px;
        color: #92a98e;
        margin-bottom: 0;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        height: 100dvh;
        border: 0;
        background: #102320;
      }
      .lock {
        display: block;
        margin: 12px auto max(12px, env(safe-area-inset-bottom));
        background: #203b33;
        border-color: #58705c;
        color: #e6eddf;
        min-height: 44px;
        font-size: 13px;
        padding: 8px 12px;
      }
    </style>
  </head>
  <body>
    <main class="gate" id="gate">
      <section class="card">
        <div class="logo" aria-hidden="true">≋</div>
        <h1>Flowy</h1>
        <p>
          A little room for balance.<br />Enter your four-digit code to play.
        </p>
        <div id="unlock">
          <div id="digits" aria-label="Code: 0 of 4 digits entered" role="img">
            ○ ○ ○ ○
          </div>
          <div class="keypad" aria-label="Numeric keypad">
            <button type="button" data-digit="1">1</button
            ><button type="button" data-digit="2">2</button
            ><button type="button" data-digit="3">3</button>
            <button type="button" data-digit="4">4</button
            ><button type="button" data-digit="5">5</button
            ><button type="button" data-digit="6">6</button>
            <button type="button" data-digit="7">7</button
            ><button type="button" data-digit="8">8</button
            ><button type="button" data-digit="9">9</button>
            <button type="button" id="clear">Clear</button
            ><button type="button" data-digit="0">0</button
            ><button
              type="button"
              id="backspace"
              aria-label="Delete last digit"
            >
              ⌫
            </button>
          </div>
          <p class="status" id="status" role="status" aria-live="polite"></p>
        </div>
        <p class="hint">
          The game unlocks on your device. Reloading locks it again.
        </p>
        <noscript><p>JavaScript is required to unlock and play.</p></noscript>
      </section>
    </main>

    <script>
      const payload = JSON.parse(
          document.querySelector("#payload").textContent,
        ),
        gate = document.querySelector("#gate"),
        digits = document.querySelector("#digits"),
        buttons = [...document.querySelectorAll(".keypad button")],
        status = document.querySelector("#status"),
        lock = document.querySelector("#lock");
      let frame = null;
      const bytes = (value) =>
        Uint8Array.from(atob(value), (c) => c.charCodeAt(0));
      let code = "",
        busy = false,
        failure = { count: 0, until: 0 };
      const attemptKey = "flowy-unlock-attempts-v1";
      function readFailures() {
        try {
          const saved = JSON.parse(localStorage.getItem(attemptKey));
          if (
            saved &&
            Number.isSafeInteger(saved.count) &&
            saved.count >= 0 &&
            Number.isFinite(saved.until)
          )
            failure = saved;
        } catch {}
      }
      function saveFailures() {
        try {
          localStorage.setItem(attemptKey, JSON.stringify(failure));
        } catch {}
      }
      function refresh() {
        const remaining = Math.max(
          0,
          Math.ceil((failure.until - Date.now()) / 1000),
        );
        for (const button of buttons) button.disabled = busy || remaining > 0;
        digits.textContent = Array.from({ length: 4 }, (_, i) =>
          i < code.length ? "●" : "○",
        ).join(" ");
        digits.setAttribute(
          "aria-label",
          `Code: ${code.length} of 4 digits entered`,
        );
        if (remaining)
          status.textContent = `Too many attempts. Try again in ${remaining}s.`;
        else if (!busy && status.textContent.startsWith("Too many attempts"))
          status.textContent = "Enter your code to try again.";
      }
      readFailures();
      refresh();
      setInterval(() => {
        readFailures();
        refresh();
      }, 250);
      addEventListener("storage", () => {
        readFailures();
        refresh();
      });
      function edit(action) {
        readFailures();
        if (busy || failure.until > Date.now() || gate.hidden) return;
        if (action === "clear") code = "";
        else if (action === "backspace") code = code.slice(0, -1);
        else if (/^\d$/.test(action) && code.length < 4) code += action;
        refresh();
        if (code.length === 4) unlock();
      }
      for (const button of buttons)
        button.addEventListener("click", () =>
          edit(button.dataset.digit ?? button.id),
        );
      addEventListener("keydown", (event) => {
        if (event.ctrlKey || event.metaKey || event.altKey || gate.hidden)
          return;
        const action = /^\d$/.test(event.key)
          ? event.key
          : event.key === "Backspace"
            ? "backspace"
            : event.key === "Escape"
              ? "clear"
              : null;
        if (action) {
          event.preventDefault();
          edit(action);
        }
      });
      async function unlock() {
        if (busy || failure.until > Date.now()) return;
        busy = true;
        const entered = code;
        code = "";
        refresh();
        status.textContent = "Unlocking…";
        try {
          if (!globalThis.crypto?.subtle) throw new Error("UNSUPPORTED");
          const material = await crypto.subtle.importKey(
            "raw",
            new TextEncoder().encode(entered),
            "PBKDF2",
            false,
            ["deriveKey"],
          );
          const key = await crypto.subtle.deriveKey(
            {
              name: "PBKDF2",
              salt: bytes(payload.salt),
              iterations: payload.iterations,
              hash: "SHA-256",
            },
            material,
            { name: "AES-GCM", length: 256 },
            false,
            ["decrypt"],
          );
          const clear = await crypto.subtle.decrypt(
            { name: "AES-GCM", iv: bytes(payload.iv) },
            key,
            bytes(payload.data),
          );
          const html = new TextDecoder().decode(clear);
          new Uint8Array(clear).fill(0);
          failure = { count: 0, until: 0 };
          saveFailures();
          status.textContent = "";
          frame = document.createElement("iframe");
          frame.title = "Flowy room arrangement game";
          frame.srcdoc = html;
          document.body.insertBefore(frame, lock);
          frame.addEventListener("load", () => {
            const resize = () => {
              frame.style.height =
                frame.contentDocument.body.scrollHeight + "px";
            };
            resize();
            new ResizeObserver(resize).observe(frame.contentDocument.body);
          });
          gate.hidden = true;
          lock.hidden = false;
          document.title = "Flowy · Room qi laboratory";
        } catch (error) {
          if (error.message === "UNSUPPORTED")
            status.textContent =
              "Open this page over HTTPS in a current browser.";
          else {
            readFailures();
            failure.count = Math.min(30, failure.count + 1);
            failure.until =
              Date.now() + Math.min(300, 2 ** failure.count) * 1000;
            saveFailures();
            status.textContent = "That code did not unlock the game.";
          }
        } finally {
          busy = false;
          refresh();
        }
      }
      lock.addEventListener("click", () => {
        if (frame) {
          frame.srcdoc = "";
          frame.remove();
          frame = null;
        }
        gate.hidden = false;
        lock.hidden = true;
        code = "";
        status.textContent = "";
        document.title = "Flowy · Enter code";
        refresh();
        buttons[0].focus();
      });
    </script>
