    <title>Flowy · Enter password</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        color: #edf0df;
        background: #102320;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
      }
      .gate {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(100%, 390px);
        padding: 30px;
        border: 1px solid #426050;
        background: #162e28;
        border-radius: 18px;
      }
      .logo {
        width: 45px;
        height: 45px;
        border: 1px solid #adc590;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 26px;
        color: #cadfa5;
      }
      h1 {
        font-family: Georgia, serif;
        font-size: 38px;
        font-weight: normal;
        margin: 18px 0 10px;
      }
      p {
        font-size: 14px;
        line-height: 1.6;
        color: #b9c9b2;
      }
      label {
        display: block;
        font-size: 14px;
        margin: 22px 0 8px;
      }
      input {
        font: inherit;
        font-size: 16px;
        display: block;
        width: 100%;
        min-height: 48px;
        padding: 12px;
        border-radius: 9px;
        border: 1px solid #58705c;
        background: #102820;
        color: #edf0df;
      }
      button {
        font: inherit;
        cursor: pointer;
        border-radius: 9px;
        min-height: 48px;
        padding: 11px 18px;
        border: 1px solid #dbedb8;
        background: #dbedb8;
        color: #20372d;
      }
      .submit {
        width: 100%;
        margin-top: 13px;
      }
      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      input:focus-visible,
      button:focus-visible {
        outline: 2px solid #e7d899;
        outline-offset: 3px;
      }
      .status {
        font-size: 13px;
        min-height: 25px;
        margin: 14px 0 0;
        color: #ebc1a5;
      }
      .hint {
        font-size: 12px;
        color: #92a98e;
        margin-bottom: 0;
      }
      iframe {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        border: 0;
        background: #102320;
      }
      .lock {
        position: fixed;
        top: max(10px, env(safe-area-inset-top));
        right: max(12px, env(safe-area-inset-right));
        z-index: 10;
        background: #203b33;
        border-color: #58705c;
        color: #e6eddf;
        min-height: 44px;
        font-size: 13px;
        padding: 8px 12px;
      }
    </style>
  </head>
  <body>
    <main class="gate" id="gate">
      <section class="card">
        <div class="logo" aria-hidden="true">≋</div>
        <h1>Flowy</h1>
        <p>A little room for balance.<br />Enter your password to play.</p>
        <form id="unlock">
          <label for="password">Password</label
          ><input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            autocapitalize="none"
            spellcheck="false"
            required
          /><button class="submit" id="submit" type="submit">
            Unlock game
          </button>
          <p class="status" id="status" role="status" aria-live="polite"></p>
        </form>
        <p class="hint">
          The game unlocks on your device. Reloading locks it again.
        </p>
        <noscript><p>JavaScript is required to unlock and play.</p></noscript>
      </section>
    </main>

    <script>
      const payload = JSON.parse(
          document.querySelector("#payload").textContent,
        ),
        gate = document.querySelector("#gate"),
        form = document.querySelector("#unlock"),
        input = document.querySelector("#password"),
        submit = document.querySelector("#submit"),
        status = document.querySelector("#status"),
        lock = document.querySelector("#lock");
      let frame = null;
      const bytes = (value) =>
        Uint8Array.from(atob(value), (c) => c.charCodeAt(0));
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (submit.disabled) return;
        submit.disabled = true;
        status.textContent = "Unlocking…";
        try {
          if (!globalThis.crypto?.subtle) throw new Error("UNSUPPORTED");
          const material = await crypto.subtle.importKey(
            "raw",
            new TextEncoder().encode(input.value),
            "PBKDF2",
            false,
            ["deriveKey"],
          );
          const key = await crypto.subtle.deriveKey(
            {
              name: "PBKDF2",
              salt: bytes(payload.salt),
              iterations: payload.iterations,
              hash: "SHA-256",
            },
            material,
            { name: "AES-GCM", length: 256 },
            false,
            ["decrypt"],
          );
          const clear = await crypto.subtle.decrypt(
            { name: "AES-GCM", iv: bytes(payload.iv) },
            key,
            bytes(payload.data),
          );
          const html = new TextDecoder().decode(clear);
          new Uint8Array(clear).fill(0);
          input.value = "";
          status.textContent = "";
          frame = document.createElement("iframe");
          frame.title = "Flowy room arrangement game";
          frame.srcdoc = html;
          document.body.append(frame);
          gate.hidden = true;
          lock.hidden = false;
          document.title = "Flowy · Room qi laboratory";
        } catch (error) {
          status.textContent =
            error.message === "UNSUPPORTED"
              ? "Open this page over HTTPS in a current browser."
              : "That password did not unlock the game.";
          input.select();
        } finally {
          submit.disabled = false;
        }
      });
      lock.addEventListener("click", () => {
        if (frame) {
          frame.srcdoc = "";
          frame.remove();
          frame = null;
        }
        gate.hidden = false;
        lock.hidden = true;
        input.value = "";
        status.textContent = "";
        document.title = "Flowy · Enter password";
        input.focus();
      });
    </script>
